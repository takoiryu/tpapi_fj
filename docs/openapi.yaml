openapi: 3.0.3

info:
  title: API Jeux Vidéo
  version: 1.0.0
  description: API REST de gestion d'une collection de jeux / blindés avec SQLite et Express.

servers:
  - url: http://localhost:3000
    description: Serveur local de développement

paths:
  /api/games:
    get:
      summary: Récupérer tous les jeux
      description: Retourne la liste complète des enregistrements présents en base de données.
      responses:
        '200':
          description: Liste des jeux récupérée avec succès.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Game'
        '500':
          description: Erreur interne du serveur lors de la récupération des données.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Ajouter un jeu
      description: Crée un nouvel enregistrement à partir des données fournies et retourne l'objet créé avec son identifiant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameInput'
      responses:
        '201':
          description: Jeu créé avec succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          description: Données d'entrée invalides ou champs obligatoires manquants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erreur interne du serveur lors de l'insertion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/games/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identifiant numérique unique de l'enregistrement.
        schema:
          type: integer
          format: int64
          minimum: 1

    get:
      summary: Récupérer un jeu
      description: Retourne les détails d'un jeu à partir de son identifiant.
      responses:
        '200':
          description: Jeu trouvé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          description: Identifiant invalide (doit être un entier).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Jeu introuvable avec cet identifiant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erreur interne du serveur.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Modifier un jeu
      description: Met à jour les informations d'un jeu existant identifié par son `id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameInput'
      responses:
        '200':
          description: Jeu modifié avec succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          description: Identifiant invalide ou corps de requête mal formé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Jeu introuvable avec cet identifiant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erreur interne du serveur lors de la mise à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Supprimer un jeu
      description: Supprime définitivement le jeu correspondant à l'identifiant fourni.
      responses:
        '204':
          description: Jeu supprimé avec succès (aucun contenu retourné).
        '400':
          description: Identifiant invalide (doit être un entier).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Jeu introuvable avec cet identifiant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erreur interne du serveur lors de la suppression.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Game:
      type: object
      required:
        - id
        - title
        - manufacturer
        - releaseYear
        - type
        - ratio
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: AMX-30
        manufacturer:
          type: string
          example: Atelier de construction de Roanne
        releaseYear:
          type: integer
          example: 1966
        type:
          type: string
          example: multirole
        ratio:
          type: number
          format: float
          example: 0.005

    CreateGameInput:
      type: object
      required:
        - title
        - manufacturer
        - releaseYear
        - type
        - ratio
      properties:
        title:
          type: string
          example: Char Leclerc
        manufacturer:
          type: string
          example: GIAT Industries (Nexter)
        releaseYear:
          type: integer
          example: 1992
        type:
          type: string
          example: char de combat principal
        ratio:
          type: number
          format: float
          example: 172.4

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Ressource introuvable.